<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Smart Cashier icon">
  <!-- Smart Cashier app icon: a receipt with a scalloped top edge rising out of a
       three-key register, with one sparkle. Homeroom brand palette, Cream + Black
       with Yellow for the sparkle. Flat fills only: no gradients, filters or text. -->
  <rect width="512" height="512" fill="#000000"/>
  <!-- receipt: scalloped top (4 bumps), right edge bows outward -->
  <path d="M196 288 V150 a16 16 0 0 1 32 0 a16 16 0 0 1 32 0 a16 16 0 0 1 32 0 a16 16 0 0 1 32 0 Q350 220 324 288 Z" fill="#FFFEEA"/>
  <!-- printed lines -->
  <rect x="220" y="186" width="80" height="18" rx="9" fill="#000000"/>
  <rect x="220" y="224" width="56" height="18" rx="9" fill="#000000"/>
  <!-- register body, 12 px gap below the receipt -->
  <rect x="120" y="300" width="272" height="116" rx="32" fill="#FFFEEA"/>
  <!-- keys -->
  <circle cx="200" cy="358" r="16" fill="#000000"/>
  <circle cx="256" cy="358" r="16" fill="#000000"/>
  <circle cx="312" cy="358" r="16" fill="#000000"/>
  <!-- sparkle -->
  <path d="M400 108 Q406 144 442 150 Q406 156 400 192 Q394 156 358 150 Q394 144 400 108 Z" fill="#FFEE6F"/>
</svg>
